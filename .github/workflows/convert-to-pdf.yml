# .github/workflows/convert-to-pdf.yml
name: Docs to PDF

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/**/*.md'
      - 'docs/images/**'

jobs:
  converttopdf:
    name: Build PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug - List files
        run: |
          echo "=== Repository structure ==="
          find . -type f -name "*.md" | head -20
          echo ""
          echo "=== docs folder ==="
          ls -la docs/ 2>/dev/null || echo "docs folder not found"

      - uses: baileyjm02/markdown-to-pdf@v1
        with:
          input_dir: docs
          output_dir: pdfs
          images_dir: docs/images
          image_import: ./docs/images
          build_html: false

      - name: Debug - Check output
        run: |
          echo "=== pdfs folder ==="
          ls -la pdfs/ 2>/dev/null || echo "pdfs folder not found"

      - uses: actions/upload-artifact@v4
        with:
          name: docs-pdf
          path: pdfs
